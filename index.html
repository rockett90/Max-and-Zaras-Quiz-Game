<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a66" />
    <title>Max and Zara's Quiz Game</title>
    <link rel="icon" type="image/png" href="/src/assets/crab.png" />
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <canvas id="game" aria-label="Underwater game area"></canvas>

        <section id="screen-loading" class="screen screen--solid" data-active>
          <p class="loading">Loading…</p>
        </section>

        <section id="screen-splash" class="screen screen--solid">
          <img class="logo" src="/src/assets/splashscreen1.png" alt="Max and Zara's Quiz Game" />
          <button id="splash-continue" class="btn btn--big" type="button">Tap to start</button>
        </section>

        <section id="screen-setup" class="screen screen--solid">
          <h1>How old are you?</h1>
          <div id="age-buttons" class="age-grid" role="radiogroup" aria-label="Your age"></div>
          <div class="how-to">
            <h2>How to play</h2>
            <ul>
              <li><kbd>→</kbd> swim forward — rocks and seaweed block your way</li>
              <li><kbd>Space</kbd> jump over them</li>
              <li><kbd>↑</kbd> blow a bubble at the floating boxes</li>
              <li>Answer the question inside — <strong>3</strong> boxes are the hardest and score the most!</li>
            </ul>
          </div>
          <button id="setup-start" class="btn btn--big" type="button" disabled>Start</button>
        </section>

        <section id="screen-question" class="screen screen--dim" aria-live="polite">
          <form id="question-form" class="card" autocomplete="off">
            <p class="card__level"></p>
            <div class="card__timer" role="meter" aria-label="Seconds left" aria-valuemin="0">
              <div class="card__timer-fill"></div>
            </div>
            <p class="card__text"></p>
            <div class="card__answers"></div>
            <p class="card__feedback"></p>
            <button class="btn card__continue" type="button" hidden>Continue</button>
          </form>
        </section>

        <section id="screen-results" class="screen screen--solid">
          <h1>Time's up!</h1>
          <p id="results-stars" class="results-stars" role="img"></p>
          <p id="results-score" class="results-score"></p>
          <p id="results-tally" class="results-tally"></p>
          <section id="results-review" class="review" aria-label="Questions to look at again" hidden></section>
          <button id="results-again" class="btn btn--big" type="button">Play again</button>
          <img class="logo logo--small" src="/src/assets/splashscreen1.png" alt="" />
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
