    status: draft

  - id: en-num-even-ten
    ages: 6-7
    level: 2
    type: true-false
    prompt: 10 is an even number.
    answer: true
    explain: Even numbers can be shared into two equal groups. 10 makes two groups of 5.
    status: draft

  # --- Word problems (one of each kind; more come from the M3 generators) ----

  - id: en-num-word-apples-get-more
    ages: 4
    level: 2
    type: typed
    prompt: You have 2 apples and get 1 more. How many apples do you have now?
    answer: "3"
    accept: [three]
    explain: 2 and 1 more makes 3. Count on from 2, then 3.
    status: draft

  - id: en-num-word-apples-eat-one
    ages: 4
    level: 3
    type: typed
    prompt: You have 3 apples and eat 1. How many are left?
    answer: "2"
    accept: [two]
    explain: Take 1 away from 3 and you have 2 left.
    status: draft

  - id: en-num-word-give-friend
    ages: 5
    level: 3
    type: typed
    prompt: You have 4 apples and give 1 to a friend. How many do you have left?
    answer: "3"
    accept: [three]
    explain: Giving one away means taking 1 from 4, which leaves 3.
    status: draft

  - id: en-num-word-fruit-total
    ages: 5-6
    level: 3
    type: typed
    prompt: You have 2 apples and 2 oranges. How many pieces of fruit is that?
    answer: "4"
    accept: [four]
    explain: Apples and oranges are both fruit, so add them. 2 and 2 make 4.
    status: draft

  - id: en-num-word-blocks-lose
    ages: 5-6
    level: 2
    type: typed
    prompt: You build a tower of 5 blocks and 2 fall off. How many blocks are still in the tower?
    answer: "3"
    accept: [three]
    explain: 5 take away 2 leaves 3.
    status: draft
