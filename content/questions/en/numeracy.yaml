    status: draft

  - id: en-num-pattern-3-5-7
    ages: 6
    level: 2
    type: choice
    prompt: 'Which number is missing? 3, __, 7'
    answer: "5"
    choices: ["4", "5", "6"]
    explain: The numbers go up in twos. 3, 5, 7.
    status: draft

  - id: en-num-pattern-4-6-8
    ages: 6
    level: 2
    type: choice
    prompt: 'Which number is missing? 4, __, 8'
    answer: "6"
    choices: ["5", "6", "7"]
    explain: The numbers go up in twos. 4, 6, 8.
    status: draft

  - id: en-num-pattern-5-7-9
    ages: 6-7
    level: 2
    type: choice
    prompt: 'Which number is missing? 5, __, 9'
    answer: "7"
    choices: ["6", "7", "8"]
    explain: The numbers go up in twos. 5, 7, 9.
    status: draft

  - id: en-num-pattern-6-8-10
    ages: 6-7
    level: 2
    type: choice
    prompt: 'Which number is missing? 6, __, 10'
