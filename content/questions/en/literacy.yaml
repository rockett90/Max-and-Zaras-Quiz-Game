    answer: sleeping
    choices: [sleeping, sleeped, sleep]
    explain: After "is" we add ing, so the cat is sleeping.
    status: draft

  - id: en-lit-homophone-read
    ages: 6-8
    level: 2
    type: choice
    prompt: 'Choose the right word: I like to __ a book.'
    answer: read
    choices: [read, red, reed]
    explain: Read is what you do with a book. Red is a colour and a reed is a plant.
    status: draft

