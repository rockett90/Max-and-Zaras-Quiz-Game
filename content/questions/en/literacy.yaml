# English literacy. Schema: src/game/questionSchema.ts.
#
# Cleaned from content/legacy/english_literacy.json (406 entries, 239 distinct):
# repeats merged into age ranges; "Spell the word 'x'" (answer shown in the prompt)
# rewritten as pick-the-spelling; "c_t" gaps (several words fit) made multiple
# choice with a clue; letter-sound questions dropped until read-aloud (M4).
# The legacy bank barely rose above Reception level, so ages 9–11 are thin here
# on purpose — new content for them is M10. All drafts until Adam reviews.
language: en
subject: literacy
questions:
