  # --- Plurals and verb tenses ---------------------------------------------

  - id: en-lit-plural-cat
    ages: 5
    level: 2
    type: typed
    prompt: There is one cat. Now there are two. Write the word for more than one cat.
    answer: cats
    explain: For most words, add s to mean more than one, so cat becomes cats.
    status: draft

  - id: en-lit-plural-dog
    ages: 5-6
    level: 2
    type: typed
    prompt: 'One dog, two ...? Write the missing word.'
    answer: dogs
    explain: Add s to mean more than one, so dog becomes dogs.
    status: draft

  - id: en-lit-plural-apple
    ages: 6
    level: 2
    type: typed
    prompt: 'One apple, three ...? Write the missing word.'
    answer: apples
    explain: Add s to mean more than one, so apple becomes apples.
    status: draft

  - id: en-lit-plural-monkey
    ages: 7-8
    level: 2
    type: choice
    prompt: Which is the right word for more than one monkey?
    answer: monkeys
    choices: [monkeys, monkies, monkeyes]
    explain: When a word ends in a vowel and y, just add s. Monkey becomes monkeys.
    status: draft

  - id: en-lit-past-jump
    ages: 6-7
    level: 2
    type: choice
    prompt: 'Today I jump. Yesterday I ...'
    answer: jumped
    choices: [jumped, jumpt, jump]
    explain: For many verbs we add ed to say it already happened, so jump becomes jumped.
    status: draft

  - id: en-lit-past-run
    ages: 6-7
    level: 3
    type: choice
    prompt: 'Today I run. Yesterday I ...'
    answer: ran
    choices: [ran, runned, run]
    explain: Run is a tricky verb. We don't say runned, we say ran.
    status: draft

  - id: en-lit-past-write
    ages: 7-9
    level: 2
    type: choice
    prompt: 'Choose the right word: Yesterday I __ a story.'
    answer: wrote
    choices: [wrote, writ, written]
    explain: Write becomes wrote. Written needs a helper word, like "I have written".
    status: draft

  - id: en-lit-ending-sleeping
    ages: 5-6
    level: 3
    type: choice
