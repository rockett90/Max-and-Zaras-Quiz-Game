    level: 2
    type: choice
    prompt: Which word is a noun?
    answer: computer
    choices: [computer, run, quickly]
    explain: A computer is a thing, so it is a noun. Quickly describes how something is done.
    status: draft

  - id: en-lit-noun-frog-jumps
    ages: 7-8
    level: 2
